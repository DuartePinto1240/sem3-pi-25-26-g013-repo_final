oke:#181818;stroke-width:1.0;" x1="74.8687" x2="473.3628" y1="116.9121" y2="116.9121"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="81.8687" y="111.6494">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.2642" x="93.0986" y="111.6494">requests order eligibility &amp; allocation (orders.csv, order_lines.csv)</text><polygon fill="#181818" points="85.8687,144.2031,75.8687,148.2031,85.8687,152.2031,81.8687,148.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="79.8687" x2="478.3628" y1="148.2031" y2="148.2031"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="91.8687" y="142.9404">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.918" x="103.0986" y="142.9404">confirms orders successfully loaded</text><polygon fill="#181818" points="909.2197,175.4941,919.2197,179.4941,909.2197,183.4941,913.2197,179.4941" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="489.3628" x2="915.2197" y1="179.4941" y2="179.4941"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="496.3628" y="174.2314">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.4688" x="507.5928" y="174.2314">loads current inventory (boxes, bays, expiry dates)</text><polygon fill="#181818" points="500.3628,206.7852,490.3628,210.7852,500.3628,214.7852,496.3628,210.7852" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="494.3628" x2="925.2197" y1="210.7852" y2="210.7852"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="506.3628" y="205.5225">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.4751" x="517.5928" y="205.5225">returns stock data organized by SKU and FEFO/FIFO order</text><polygon fill="#181818" points="909.2197,275.6582,919.2197,279.6582,909.2197,283.6582,913.2197,279.6582" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="489.3628" x2="915.2197" y1="279.6582" y2="279.6582"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="496.3628" y="274.3955">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4561" x="507.5928" y="274.3955">processes orders by priority, dueDate, orderId</text><path d="M936,223.7852 L936,319.7852 L1234,319.7852 L1234,233.7852 L1224,223.7852 L936,223.7852 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1224,223.7852 L1224,233.7852 L1234,233.7852 L1224,223.7852 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.4917" x="942" y="242.8135">Within each order:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.8638" x="942" y="260.1045">&#8226; Lines sorted by lineNo ASC</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.8638" x="942" y="277.3955">&#8226; Allocation walks boxes in FEFO/FIFO order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.3228" x="942" y="294.6865">&#8226; allocate = min(remainingQty, box.qtyAvailable)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.52" x="942" y="311.9775">&#8226; reduce remainingQty until satisfied or no stock</text><polygon fill="#181818" points="500.3628,344.5313,490.3628,348.5313,500.3628,352.5313,496.3628,348.5313" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="494.3628" x2="925.2197" y1="348.5313" y2="348.5313"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="506.3628" y="343.2686">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.7241" x="517.5928" y="343.2686">returns allocation fragments (orderId, lineNo, boxId, qty, bay)</text><polygon fill="#181818" points="909.2197,396.1133,919.2197,400.1133,909.2197,404.1133,913.2197,400.1133" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="489.3628" x2="915.2197" y1="400.1133" y2="400.1133"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="496.3628" y="394.8506">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.9771" x="507.5928" y="394.8506">evaluate eligibility mode (strict / partial)</text><path d="M936,361.5313 L936,422.5313 L1286,422.5313 L1286,371.5313 L1276,361.5313 L936,361.5313 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1276,361.5313 L1276,371.5313 L1286,371.5313 L1276,361.5313 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.6309" x="942" y="380.5596">Modes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.3228" x="942" y="397.8506">&#8226; strict &#8594; full quantity required (else UNDISPATCHABLE)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.9873" x="942" y="415.1416">&#822