<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="495px" preserveAspectRatio="none" style="width:955px;height:495px;background:#FFFFFF;" version="1.1" viewBox="0 0 955 495" width="955px" zoomAndPan="magnify"><title>SSD - USBD12: List of Wagons by Type, Gauge, and Operator</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="409.165" x="269.6333" y="30.1074">SSD - USBD12: List of Wagons by Type, Gauge, and Operator</text><rect fill="#FFFFFF" height="261.4922" style="stroke:#181818;stroke-width:1.0;" width="10" x="36.0654" y="133.2422"/><rect fill="#FFFFFF" height="238.2012" style="stroke:#181818;stroke-width:1.0;" width="10" x="326.6587" y="156.5332"/><rect fill="#FFFFFF" height="94.8096" style="stroke:#181818;stroke-width:1.0;" width="10" x="587.5049" y="268.6338"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="41" x2="41" y1="123.2422" y2="412.7344"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="331.3208" x2="331.3208" y1="123.2422" y2="412.7344"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="591.5879" x2="591.5879" y1="123.2422" y2="412.7344"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="5" y="119.7285">PLANNER</text><ellipse cx="41.0654" cy="53.1211" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M41.0654,61.1211 L41.0654,88.1211 M28.0654,69.1211 L54.0654,69.1211 M41.0654,88.1211 L28.0654,103.1211 M41.0654,88.1211 L54.0654,103.1211 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.1309" x="5" y="426.8418">PLANNER</text><ellipse cx="41.0654" cy="438.8555" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M41.0654,446.8555 L41.0654,473.8555 M28.0654,454.8555 L54.0654,454.8555 M41.0654,473.8555 L28.0654,488.8555 M41.0654,473.8555 L54.0654,488.8555 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="32.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="60.6758" x="301.3208" y="89.6211"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.6758" x="308.3208" y="111.7285">System</text><rect fill="#E2E2F0" height="32.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="60.6758" x="301.3208" y="411.7344"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="46.6758" x="308.3208" y="433.8418">System</text><rect fill="#E2E2F0" height="32.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="105.834" x="539.5879" y="89.6211"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.834" x="546.5879" y="111.7285">SQL Database</text><rect fill="#E2E2F0" height="32.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="105.834" x="539.5879" y="411.7344"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.834" x="546.5879" y="433.8418">SQL Database</text><rect fill="#FFFFFF" height="261.4922" style="stroke:#181818;stroke-width:1.0;" width="10" x="36.0654" y="133.2422"/><rect fill="#FFFFFF" height="238.2012" style="stroke:#181818;stroke-width:1.0;" width="10" x="326.6587" y="156.5332"/><rect fill="#FFFFFF" height="94.8096" style="stroke:#181818;stroke-width:1.0;" width="10" x="587.5049" y="268.6338"/><polygon fill="#181818" points="314.6587,152.5332,324.6587,156.5332,314.6587,160.5332,318.6587,156.5332" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="46.0654" x2="320.6587" y1="156.5332" y2="156.5332"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5933" x="53.0654" y="151.2705">request list of wagons (type, gauge, operator)</text><polygon fill="#181818" points="575.5049,264.6338,585.5049,268.6338,575.5049,272.6338,579.5049,268.6338" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="336.6587" x2="581.5049" y1="268.6338" y2="268.6338"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2871" x="343.6587" y="246.0801">execute SQL query</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7598" x="343.6587" y="263.3711">(filter by type, gauge, operator)</text><path d="M602,169.5332 L602,334.5332 L948,334.5332 L948,179.5332 L938,169.5332 L602,169.5332 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M938,169.5332 L938,179.5332 L948,179.5332 L938,169.5332 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.9727" x="608" y="188.5615">SQL logic:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.9268" x="608" y="205.8525">SELECT wagon_id, type, gauge, tare, payload_capacity,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2197" x="633.2827" y="223.1436">volume_capacity, operator_name</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4453" x="608" y="240.4346">FROM wagon JOIN operator</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0054" x="608" y="257.7256">WHERE LOWER(type)=LOWER(:type)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.2207" x="615.2236" y="275.0166">AND LOWER(gauge)=LOWER(:gauge)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.5098" x="615.2236" y="292.3076">AND LOWER(operator_name)=LOWER(:operator)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.252" x="615.2236" y="309.5986">AND status='ACTIVE'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.7808" x="608" y="326.8896">ORDER BY wagon_id;</text><polygon fill="#181818" points="347.6587,359.4434,337.6587,363.4434,347.6587,367.4434,343.6587,363.4434" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="341.6587" x2="591.5049" y1="363.4434" y2="363.4434"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.8462" x="353.6587" y="358.1807">return query results (rows or empty set)</text><polygon fill="#181818" points="52.0654,390.7344,42.0654,394.7344,52.0654,398.7344,48.0654,394.7344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="46.0654" x2="330.6587" y1="394.7344" y2="394.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.0801" x="58.0654" y="389.4717">display wagon list or "No wagons found"</text><!--SRC=[XPB1Rjim38RlUWeYbpP0SjYE7beWgRsjWsUdJjgWm820jHLFW6Dv4jtMRrzQSfnqFLG7ImH_VVfDaXHL4jRh4EPmlrw6Nxu642jBeFUmnLBN5fuws7IDdC4FR4lUi2uWRQH1qaO8p7c3LRn8aYWJ3HfIkMgm9fYiEqloC06qi5Yj_ilTnH0YuHDQwHJXqh7KCv8SSM8umFowHq00Hlvh9Tkh1eyltkCbEOUbTwW7TzCJiJSWUWIJmYM3vAlCMqxqHXXfkZ_rvLvL94t_mv_Xs6sjUJUg_4i2UFMSIfSg3tmOnT7DnjlRgMBsdaXe-DjWLsaiTZasc2lgPkxci9vrrHxaAJUwsDLua4xvFKj_-nVWLtgRZ0gNtFwCiWZYT1jbhZZJAtyEN32yj4Z2GUACZHeVVH2zip2AJ-KvwIqXjVRgOd6pkNs8BbmcpKBkvF9nBCet8NcK-ZeARidyhCVKcjftXGFRLiGTDlh50e-QF3JKWPKq5OKyRuXlBrEEGnD0eMnJOJSKoS-CWKcYZtEprsrTJCv1Rb3EuW7s1W00]--></g></svg>